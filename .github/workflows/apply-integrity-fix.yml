name: Apply site integrity repair

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: forecast-refresh
  cancel-in-progress: false

jobs:
  repair:
    name: Apply, validate, and launch corrected forecast
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      JAX_PLATFORM_NAME: cpu
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write integrity repair
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          files = {
              "predictor/integrity.py": """""",
              "predictor/run.py": """""",
              "tests/test_integrity.py": """""",
              ".github/workflows/test.yml": """""",
          }

          for path_text, encoded in files.items():
              path = Path(path_text)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              print(f"Wrote {path}")
          PY

      - name: Check Python syntax
        run: |
          python -m compileall predictor tests scripts

      - name: Run integrity regression tests
        run: |
          python -m unittest tests.test_integrity -v

      - name: Run source reliability tests
        run: |
          python -m unittest tests.test_source_reliability -v

      - name: Run full test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Validate EPL sources without fitting
        run: |
          python -m predictor.run --league epl --refresh --preflight-only

      - name: Validate MLS sources without fitting
        run: |
          python -m predictor.run --league mls --refresh --preflight-only

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-integrity-fix.yml

          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi

          git commit -m "Fix schedule and source integrity"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Launch corrected forecast rebuild
        run: |
          gh workflow run update-forecast.yml --ref main
          echo "Corrected Update forecasts workflow dispatched."
