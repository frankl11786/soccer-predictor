name: Backfill historical match comparisons

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-refresh
  cancel-in-progress: false

jobs:
  backfill:
    name: Recover, archive and deploy historical comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      FTP_TLS: ${{ secrets.FTP_TLS }}
    steps:
      - name: Check out latest main with full repository history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate archive code
        run: python3 -m unittest tests.test_history tests.test_prediction_archive -v

      - name: Recover historical pregame snapshots into permanent archive
        run: python3 scripts/backfill_history.py --league both

      - name: Commit recovered history and archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add app/data/epl.json app/data/mls.json history

          if git diff --cached --quiet; then
            echo "No new historical snapshots were recovered."
          else
            git commit -m "Backfill permanent prediction archive"

            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Could not safely rebase historical archive onto latest main."
                exit 1
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Unable to push historical archive after 3 attempts."
                exit 1
              fi
              echo "main changed during publish; retrying ($attempt/3)..."
              sleep 2
            done
          fi

      - name: Deploy website to GoDaddy
        run: python3 scripts/deploy_ftp.py
